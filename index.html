function handleSocialAction(b){let a=b.dataset.action,i=Number(b.dataset.index),v=b.dataset.value;if(!['staff-tab','my-work','hire-role','hire-hours','hire-friend-select','hire-friend-preview','hire-friend-commit','train','job-picker','job-role','job-hours','job-friend','start-job','claim-wage','home','throw-trash','clean-trash','clean-all','staff-manage','staff-switch','staff-dismiss-preview','staff-dismiss-commit'].includes(a))return false;switch(a){
 case'staff-tab':staffTab=v;staff();break;

let consoleWide=innerWidth>740;
function consoleMarkup(){S.ensure(s);return `<div class="console-heading"><span>⚙ 测试操控台</span><small>本地 Demo · 重开店修正版 R2</small></div><p id="console-readout" class="console-readout"></p><section><h2>玩家餐厅</h2><div class="console-field"><label for="console-level">餐厅等级</label><select id="console-level">${[1,2,3].map(n=>`<option value="${n}" ${E.level(s)===n?'selected':''}>Lv.${n}</option>`).join('')}</select>${btn('设置','console-level')}</div><div class="console-field"><label for="console-coins">金币</label><input id="console-coins" type="number" min="0" max="10000000" step="1" value="${s.coins}" aria-describedby="console-message">${btn('设置','console-coins')}</div><div class="console-field"><label for="console-trash-count">垃圾</label><input id="console-trash-count" type="number" min="0" max="8" step="1" value="${S.ensure(s).ownGarbage.length}"><button onclick="dispatchButton(this)" data-action="console-trash">设置</button></div><div class="console-speed">${[1,4,8].map(n=>btn('×'+n,'console-speed',`data-value="${n}"`)).join('')}</div></section><section><h2>好友状态</h2>${S.FRIENDS.map(f=>`<div class="console-friend"><b>${f.icon} ${f.name}</b><div class="console-friend-fields"><label for="console-friend-${f.id}">受雇状态</label><select id="console-friend-${f.id}"><option value="available">可雇佣</option><option value="busy">已被雇佣</option><option value="resting">休息中</option></select><label for="console-business-${f.id}">经营状态</label><select id="console-business-${f.id}"><option value="keep">保持当前</option><option value="open">正常营业</option><option value="soldout">主菜售罄</option></select></div>${btn('应用好友状态','console-friend',`data-index="${f.id}"`,'wide')}</div>`).join('')}</section><section><h2>本人被雇佣 GM</h2><div class="console-friend-fields"><label for="console-job-friend">雇主好友</label><select id="console-job-friend">${S.FRIENDS.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select><label for="console-job-role">兼职岗位</label><select id="console-job-role"><option value="waiter">服务员</option><option value="chef">厨师</option></select><label for="console-job-hours">合同时长</label><select id="console-job-hours"><option value="4">4小时</option><option value="12">12小时</option><option value="24">24小时</option></select></div><p id="console-job-state" class="subtle"></p><div class="console-time">${btn('设为被雇佣','console-employ-me')}${btn('结束当前兼职','console-end-job')}</div></section><section><h2>推进时间</h2><div class="console-time">${[60,3600,14400].map(n=>btn(n===60?'+1分钟':n===3600?'+1小时':'+4小时','console-time',`data-value="${n}"`)).join('')}</div></section><section><h2>快速场景</h2><div class="console-presets">${[['normal','正常开店'],['last','最后1份'],['counter','置菜台满'],['bill','待收款']].map(([v,n])=>btn(n,'console-scenario',`data-value="${v}"`)).join('')}</div></section><section><h2>重新开店</h2><p class="subtle">清空当前浏览器的经营进度、好友状态与兼职记录，恢复初始开局。此操作不可撤销。</p>${btn('清空数据，重新开店','console-reset','','danger wide')}</section><p id="console-message" role="status" aria-live="polite"></p>`;}

function handleConsoleAction(b){let a=b.dataset.action;if(!a.startsWith('console-'))return false;switch(a){

 case'console-end-job':consoleResult(()=>{let w=S.ensure(s),record=w.records.find(r=>r.status==='working');if(!record)throw Error('当前没有进行中的兼职');let oldEnd=record.end;record.end=s.time;for(let worker of w.restaurants[record.friendId].staff)if(worker.source==='player'&&worker.expires===oldEnd){worker.expires=s.time;worker.retired=true;}E.processStaffChanges(w.restaurants[record.friendId]);S.settle(s);},'当前兼职已结束，工资可在我的兼职领取');if(modalView==='my-work')myWork();break;

entities.push({depth:9.3,draw(){cube(1,2,8,1,40,'#fff0ca','#b47c37','#c88c43');for(let i=0;i<5;i++){quad(1.06+i*1.6,2.06,1.48,.88,41,'#ffe6b1','#c99f64');let o=s.orders.filter(o=>['ready','walking-pickup','picking'].includes(o.stage)&&o.counterIndex===i)[0];if(o){let q=pt(1.8+i*1.6,2.5,43);ellipse(q.x,q.y,20,11,'#fff9e8');emoji(D[o.dish].icon,q.x,q.y,23);}}}});
for(let trash of visibleTrash()){entities.push({depth:trash.x+trash.y-.1,draw(){let p=pt(trash.x,trash.y);ellipse(p.x,p.y+1,15,6,'#68502833');ctx.fillStyle='#805629';emoji('🍂',p.x,p.y,26);}});}
tablePos.forEach(([x,y],i)=>entities.push({depth:x+y+.8,draw:()=>table(x,y,i>=s.tables,i)}));
for(let g of s.guests){let [x,y]=guestPosition(g);entities.push({depth:x+y+1.2,draw(){let seated=['ordered','eating','bill'].includes(g.stage),key=seated?['seat','seatB','seatG'][g.id%3]:['guest','guestB','guestG'][g.id%3];let p=sprite(key,x,y,seated?87:100,seated?6:0,['bad','coin'].includes(g.stage)?Math.min(1,g.t):1);if(g.stage==='waiting')bubble(p,'',g.patience);else if(g.stage==='ordered'){let o=s.orders.find(o=>o.guest===g.id);bubble(p,o?D[o.dish].icon:'🥔');}else if(g.stage==='eating'){bubble(p,'🍴');let q=pt(x-.3,y-.7,45);emoji('🍽️',q.x,q.y,24);}else if(g.stage==='bill')bubble(p,g.reviewUntil>s.time?'👍':'🧾');else if(g.stage==='bad')bubble(p,'👎');else if(g.stage==='coin')bubble(p,'🪙');}});}
for(let w of s.staff.filter(w=>w.role==='waiter')){let wx=Number.isFinite(w.x)?w.x:9,wy=Number.isFinite(w.y)?w.y:4;if(w.phase&&w.path?.length){let next=w.path[0],dx=next.x-wx,dy=next.y-wy,d=Math.abs(dx)+Math.abs(dy),fraction=d?Math.min(1,acc*1.8/d):0;wx+=dx*fraction;wy+=dy*fraction;}let x=wx+.5,y=wy+.5;entities.push({depth:x+y+1,draw(){let bob=w.phase&&!matchMedia('(prefers-reduced-motion: reduce)').matches?Math.sin(visualClock/140)*2:0;sprite('waitress',x,y,105,bob);}});
}
entities.sort((a,b)=>a.depth-b.depth).forEach(x=>x.draw());
// Front edge and garden border.
line(pt(0,10),pt(10,10),'#f9d2ac',5);line(pt(10,0),pt(10,10),'#f9d2ac',5);
if(s.expandAt){let q=pt(8.6,5);emoji('🪚',q.x,q.y,35);text(duration(s.expandAt-s.time),q.x,q.y+24,15);}if(!s.opened){ctx.fillStyle='#5c73345a';ctx.fillRect(0,0,760,720);let q=pt(4,4);text('你的小馆，等你开张',q.x,q.y+55,28,'#fff6d3');}
}
// A single writer protects browser-local saves; another window becomes read-only.
addEventListener('storage',ev=>{if(ev.key===KEY&&ev.newValue){readOnly=true;$('save-state').textContent='另一窗口正在经营 · 本页只读';toast('检测到另一窗口更新，本页已停止写入，请刷新接续');}});
try{let raw=localStorage.getItem(KEY);if(raw){let data=JSON.parse(raw);if(data.state?.version!==1||!Array.isArray(data.state.slots)||data.state.slots.length!==6)throw Error('invalid');s=data.state;E.normalizeSlots(s);let elapsed=Math.max(0,(Date.now()-data.saved)/1000),before={...s.stats};E.advance(s,elapsed);if(elapsed>=10&&s.opened)away={seconds:elapsed,sales:s.stats.sales-before.sales,income:s.stats.income-before.income,xp:s.stats.xp-before.xp};}}catch{toast('存档不可用，已恢复已开业演示餐厅');s=E.scenario('normal');}
if(!s.opened&&!s.needsSetup)s=E.scenario('normal');
initConsole();render();walletLayer();if(s.needsSetup&&!s.opened)setup();else if(away)showAway(away);
function tick(now){let dt=Math.max(0,(now-last)/1000);last=now;if(!readOnly&&!document.hidden){acc+=dt*speed;if(acc>=.25){let whole=Math.floor(acc/.25)*.25;E.advance(s,whole);acc-=whole;render();if(modalView==='recipes'&&!S.canChange(s)){$('modal-body').querySelector('[data-action=change-preview]')?.closest('.actions').remove();}if(modalView==='my-work'){let active=s.social?.records.find(r=>r.status==='working'),el=$('job-remaining');if(active&&el)el.textContent=duration(Math.max(0,active.end-s.time));else if(el)myWork();}if(modalView==='purchase'){let b=$('modal-body').querySelector('[data-action=buy]');if(b)quote(Number(b.dataset.index),b.dataset.id);}}if(now-savedAt>2000){save();savedAt=now;}}drawScene(now);requestAnimationFrame(tick);}requestAnimationFrame(tick);
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){save();hiddenAt=Date.now();}else if(hiddenAt){let elapsed=(Date.now()-hiddenAt)/1000;hiddenAt=0;last=performance.now();if(!readOnly&&elapsed>=1){let before={...s.stats};E.advance(s,elapsed);save();render();if(elapsed>=10)showAway({seconds:elapsed,sales:s.stats.sales-before.sales,income:s.stats.income-before.income,xp:s.stats.xp-before.xp});}}});addEventListener('pagehide',save);
// Read-only inspection surface for automated verification.
globalThis.demoInspect=()=>JSON.parse(JSON.stringify(s));
